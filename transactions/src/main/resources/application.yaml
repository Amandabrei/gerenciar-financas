server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: transactions

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

services:
  user:
    base-url: ${USER_SERVICE_URL:http://localhost:8082}
  account:
    base-url: ${ACCOUNT_API_URL:https://6aeb6914ee39618d7bf84ac4.mockapi.io/accounts}
  exchange:
    base-url: ${EXCHANGE_API_URL:https://brasilapi.com.br/api/cambio/v1}